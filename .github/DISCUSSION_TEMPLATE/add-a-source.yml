title: "Card Name: Word"
labels: ["new source"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Tell us where the word is said out loud, and we'll go listen. For a correction, tell us where it's said differently. A name heard in an official recording becomes Verified on [SwooSay](https://swoosay.com).
  - type: dropdown
    id: kind
    attributes:
      label: This Is
      description: A source for a word we haven't verified yet, or a correction to one we have.
      options:
        - A source (it isn't verified yet)
        - A correction (it's said differently than we have it)
    validations:
      required: true
  - type: input
    id: card
    attributes:
      label: Card
      description: The card's name, as printed.
      placeholder: Ki-Adi-Mundi
    validations:
      required: true
  - type: input
    id: word
    attributes:
      label: Word
      description: The word you heard said.
      placeholder: Ki-Adi-Mundi
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type of Source
      description: Where you heard it. Only official sources count.
      options:
        - Film
        - Show
        - Game
        - Audiobook
        - Radio drama
        - Official video or interview (Lucasfilm, Star Wars, or the people who made it)
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where It's Said
      description: The show, film, game, audiobook, or interview, and the episode or chapter.
      placeholder: The Clone Wars, Season 6, Episode 11, "Voices"
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Time
      description: When in it the word is said, in minutes and seconds.
      placeholder: "2:10"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: Optional. A link that opens at the time, if there is one (a video, for example).
  - type: input
    id: how
    attributes:
      label: How It's Said
      description: |
        How it's said there. Any way that gets the sound across is fine:
        - **Syllables:** split the word with hyphens and put the stressed syllable in capitals, like `KEE AD-ee MUUN-dee` or `ah-SOH-kuh`.
        - **Sound-alikes:** compare any tricky part to a familiar word, like "the oo of *book*" or "rhymes with *care*".
        - **IPA:** if you know it, use it, like `/ˈkɛɹɪs/`.
      placeholder: KEE AD-ee MUUN-dee
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional. Anything else, like who says it.
  - type: checkboxes
    id: confirm
    attributes:
      label: Before You Send
      options:
        - label: I listened to it myself at this time, and the word is said out loud there.
          required: true
        - label: It's an official source (a film, show, game, audiobook, or an interview with the people who made it), not a fan video or a wiki.
          required: true
